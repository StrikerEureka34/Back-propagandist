# krkn service-hijacking: the shipping Service is pointed at krkn's mock web server. Quotes still work
# (200 with a valid cost_usd, the shape checkout parses: src/checkout/main.go L515 at 3.1.0), but
# /ship-order answers 500. Checkout charges the card (L361) before it ships (L374) and never refunds,
# so this asks: does a shipping failure leave customers charged with no order?
service_target_port: 8080
service_name: shipping
service_namespace: otel-demo
image: quay.io/krkn-chaos/krkn-service-hijacking:v0.1.3
chaos_duration: 120
privileged: True
plan:
  - resource: "/get-quote"
    steps:
      POST:
        - duration: 120 # krkn's schema requires it on every step
          status: 200
          mime_type: "application/json"
          payload: '{"cost_usd": {"currency_code": "USD", "units": 8, "nanos": 990000000}}'
  - resource: "/ship-order"
    steps:
      POST:
        - duration: 120
          status: 500
          mime_type: "application/json"
          payload: '{"error": "shipping unavailable"}'
