# Overrides for open-telemetry/opentelemetry-demo. Everything else stays at chart defaults,
# which is what the chart's own CI installs on kind.
default:
  schedulingRules:
    nodeSelector: {chaos-zone: blast} # backends; the steady ones override below (k8s/kind.yaml)

components:
  frontend: {schedulingRules: {nodeSelector: {chaos-zone: steady}}}
  load-generator: {schedulingRules: {nodeSelector: {chaos-zone: steady}}}
  flagd: {schedulingRules: {nodeSelector: {chaos-zone: steady}}}
  # Fix for catalog-kill (#19): a second replica, plus a preStop sleep from k8s/product-catalog-patch.yaml
  # (the chart has no lifecycle field). Re-apply that patch after any helm install/upgrade.
  product-catalog: {replicas: 2}
  telemetry-docs: {schedulingRules: {nodeSelector: {chaos-zone: steady}}}
  opamp-server: {schedulingRules: {nodeSelector: {chaos-zone: steady}}}
  frontend-proxy:
    schedulingRules: {nodeSelector: {chaos-zone: steady}}
    service:
      type: NodePort
      nodePort: 30080 # host :8080 via k8s/kind.yaml
  # Low on memory (G1 < 3 GB free)? Uncomment these three and the two blocks at the end,
  # then `helm uninstall otel -n otel-demo` and install again (the chart can't upgrade in place).
  # agent: {enabled: false}
  # chatbot: {enabled: false}
  # mcp: {enabled: false}

prometheus:
  server:
    nodeSelector: {chaos-zone: steady}
    service:
      type: NodePort
      nodePort: 30090 # host :9090 via k8s/kind.yaml

jaeger:
  jaeger:
    nodeSelector: {chaos-zone: steady}
grafana:
  nodeSelector: {chaos-zone: steady}
opensearch:
  nodeSelector: {chaos-zone: steady}
# The collector is a DaemonSet (one per node), so it stays unpinned.

