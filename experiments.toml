[[experiment]]
id = "blast-memory"
scenario = "node-memory-hog"
target = "node:chaos-worker"
probe_url = "http://localhost:8080/api/products"
note = "1 GiB memory pressure on the backend node"
[experiment.params]
chaos-duration = 120
# ponytail: fixed 1g, not krkn's default 90 %: a kind node's memory is the laptop's memory.
# Raise it only with free RAM to spare (free -m).
memory-consumption = "1g"
memory-workers = 1
namespace = "otel-demo"
node-selector = "kubernetes.io/hostname=chaos-worker"
[experiment.abort_if]
error_rate = 0.5
p95_ms = 2000
max_s = 360

# Known-answer controls: two of the demo's planted flagd bugs, used only to check that bank.py
# measures correctly (if payment-failure-100 doesn't rate high, the measurement is broken).
# Not part of the bank itself: their outcome is written into the demo. scenario = "flagd";
# params = flag, variant, duration (s); switching the flag off is the kill switch.
# 120 s because span metrics reach Prometheus once a minute (bank.py needs two samples).

[[experiment]]
id = "control-payment-failure"
scenario = "flagd"
target = "opentelemetry.io/name=payment"
probe_url = "http://localhost:8080/api/products"
note = "control: every charge fails"
expect = "high" # checkout returns errors to the customer
[experiment.params]
flag = "paymentFailure"
variant = "100%"
duration = 120
[experiment.abort_if]
error_rate = 0.5
p95_ms = 2000
max_s = 240

[[experiment]]
id = "control-ad-cpu"
scenario = "flagd"
target = "opentelemetry.io/name=ad"
probe_url = "http://localhost:8080/api/products"
note = "control: high CPU in the ad service"
expect = "low" # CPU strain only, nothing a customer sees
[experiment.params]
flag = "adHighCpu"
variant = "on"
duration = 120
[experiment.abort_if]
error_rate = 0.5
p95_ms = 2000
max_s = 240
