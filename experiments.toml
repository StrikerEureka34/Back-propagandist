[experiment.params]
namespace = "^otel-demo$"
pod-label = "opentelemetry.io/name=product-catalog"
disruption-count = 1
expected-recovery-time = 120
[experiment.abort_if]
error_rate = 0.5
p95_ms = 2000
max_s = 240

